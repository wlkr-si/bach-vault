name: Publish Vault index
on:
  push:
    branches: [main, 'workshop-staging-*']
    # The score inputs shape the published dataset, so a correction to them republishes it.
    paths: [manifest.json, withdrawn.json, 'bench/scores/**']

permissions:
  contents: read

concurrency:
  group: publish-vault-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.created && !github.event.deleted }}
    env:
      VAULT_BRANCH: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Verify permanent records and public media
        env:
          BASE_REVISION: ${{ github.event.before }}
        run: npm run integrity -- --remote
      - run: npm run determinism
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Publish versioned details and index
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.ts
